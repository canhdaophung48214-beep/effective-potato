<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>profile-concept</title>
<link rel="stylesheet" href="concept.css" />
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <div>9:41</div>
    <div class="right">
      <div class="bar"><i></i><i></i><i></i><i></i></div>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#241E1A" stroke-width="1.4" stroke-linecap="round">
        <path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.6a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="9.2" r=".9" fill="#241E1A" stroke="none"/>
      </svg>
      <div class="battery"><i></i></div>
    </div>
  </div>

  <div class="appbar">
    <div class="brand">
      <h1>我的</h1>
      <p>投稿进度与贡献记录</p>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9C9289" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/>
    </svg>
  </div>

  <div class="screen">

    <!-- 资料 -->
    <div class="me-head">
      <div class="avatar">我</div>
      <div class="info">
        <b>校园用户 · 未设置昵称</b>
        <small>山东理工大学 · 微信登录（概念）</small>
      </div>
    </div>

    <!-- 贡献概览 -->
    <div class="card stats">
      <div><b>3</b><span>我的投稿</span></div>
      <div><b>1</b><span>已通过</span></div>
      <div><b>2</b><span>待审核</span></div>
    </div>

    <div class="group-title">我的投稿</div>
    <div class="card menu">
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6v4.8l3.2 1.9"/></svg>
        待审核
        <span class="cnt" style="display:inline-flex;align-items:center;gap:6px"><span class="badge wait">2 条</span></span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9 17l10.5-10.5"/></svg>
        已通过
        <span class="cnt" style="display:inline-flex;align-items:center;gap:6px"><span class="badge pass">1 条</span></span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.8v5M12 16h.01"/></svg>
        需补充信息
        <span class="cnt">0 条</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
        已驳回
        <span class="cnt">0 条</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <div class="group-title">我的内容</div>
    <div class="card menu">
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 4.2 2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.7-5 2.7 1-5.6-4.1-4 5.6-.8z"/></svg>
        我的评分与评价
        <span class="cnt">0 条</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.4A4 4 0 0 1 12 7.6 4 4 0 0 1 19 10.6C19 15.4 12 20 12 20z"/></svg>
        我的收藏
        <span class="cnt">0 条</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <div class="group-title">更多</div>
    <div class="card menu">
      <div class="it">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 12a7.5 7.5 0 1 1 3 6l-3.4.9.9-3.3"/><path d="M12 8.4v4.2M12 15.6h.01"/></svg>
        帮助与反馈
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

  </div>

  <div class="concept-mark">概念设计稿 · 未实现的交互仅作示意</div>

  <div class="tabbar">
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 10.4 12 3.6l8.5 6.8V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3.8 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 10l5.9-.9z"/></svg>
      <span>评分</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M20 14.5a2 2 0 0 1-2 2H8l-4 3.2V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>
      <span>社区</span>
    </div>
    <div class="tab on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.6" r="3.7"/><path d="M4.8 20.2a7.4 7.4 0 0 1 14.4 0"/></svg>
      <span>我的</span>
    </div>
  </div>

</div>
</body>
</html>
